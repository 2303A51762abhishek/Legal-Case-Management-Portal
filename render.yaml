services:
  - type: web
    name: jurisflow-portal
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Enter your MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: MAX_FILE_SIZE_BYTES
        value: 10485760
      - key: STUDENT_NAME
        value: "MAMILLAPALLY ABHISHEK"
      - key: STUDENT_ROLL
        value: "2303A51762"
      - key: ACADEMIC_YEAR
        value: "2026-2027"
