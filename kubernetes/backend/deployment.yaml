apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jurisflow
  labels:
    app.kubernetes.io/name: jurisflow
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: legal-case-management-portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jurisflow
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: legal-case-management-portal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: legal-case-management-portal-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: jurisflow-config
                  key: NODE_ENV
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: jurisflow-config
                  key: HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: jurisflow-config
                  key: PORT
            - name: CLIENT_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: jurisflow-config
                  key: CLIENT_ORIGIN
            - name: FILE_UPLOAD_PATH
              valueFrom:
                configMapKeyRef:
                  name: jurisflow-config
                  key: FILE_UPLOAD_PATH
            - name: MAX_FILE_SIZE_BYTES
              valueFrom:
                configMapKeyRef:
                  name: jurisflow-config
                  key: MAX_FILE_SIZE_BYTES
            - name: STUDENT_NAME
              valueFrom:
                configMapKeyRef:
                  name: jurisflow-config
                  key: STUDENT_NAME
            - name: STUDENT_ROLL
              valueFrom:
                configMapKeyRef:
                  name: jurisflow-config
                  key: STUDENT_ROLL
            - name: ACADEMIC_YEAR
              valueFrom:
                configMapKeyRef:
                  name: jurisflow-config
                  key: ACADEMIC_YEAR
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jurisflow-secrets
                  key: jwt-secret
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: jurisflow-secrets
                  key: mongodb-uri
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: document-vault
              mountPath: /usr/src/app/src/uploads
      volumes:
        - name: document-vault
          persistentVolumeClaim:
            claimName: jurisflow-vault-pvc
