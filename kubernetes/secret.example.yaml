# ==============================================================================
# JurisFlow — Kubernetes Secret Template (Example)
# DO NOT COMMIT REAL PASSWORDS OR PRODUCTION SECRETS TO VERSION CONTROL
#
# Create the actual secret imperatively in your Kubernetes cluster using:
#
# kubectl create secret generic jurisflow-secrets \
#   --namespace=jurisflow \
#   --from-literal=mongo-root-username=admin \
#   --from-literal=mongo-root-password='<CHANGE_ME_IN_PRODUCTION>' \
#   --from-literal=jwt-secret='<CHANGE_ME_JWT_SECRET>' \
#   --from-literal=mongodb-uri='mongodb://admin:<CHANGE_ME_PASSWORD>@mongodb.jurisflow.svc.cluster.local:27017/legal_case_management_db?authSource=admin'
#
# Or copy this file to secret.yaml (which is git-ignored) and apply:
# kubectl apply -f kubernetes/secret.yaml
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: jurisflow-secrets
  namespace: jurisflow
  labels:
    app.kubernetes.io/name: jurisflow
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: legal-case-management-portal
type: Opaque
stringData:
  mongo-root-username: "admin"
  mongo-root-password: "CHANGE_ME_TO_SECURE_PASSWORD"
  jwt-secret: "CHANGE_ME_TO_SECURE_RANDOM_JWT_SECRET_KEY"
  mongodb-uri: "mongodb://admin:CHANGE_ME_TO_SECURE_PASSWORD@mongodb.jurisflow.svc.cluster.local:27017/legal_case_management_db?authSource=admin"
