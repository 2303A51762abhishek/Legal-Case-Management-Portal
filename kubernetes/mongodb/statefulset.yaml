apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: jurisflow
  labels:
    app.kubernetes.io/name: jurisflow
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: legal-case-management-portal
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jurisflow
        app.kubernetes.io/component: mongodb
        app.kubernetes.io/part-of: legal-case-management-portal
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jurisflow-secrets
                  key: mongo-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jurisflow-secrets
                  key: mongo-root-password
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: jurisflow-config
                  key: MONGODB_DATABASE
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - 127.0.0.1:27017/test
                - --eval
                - "quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)"
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - 127.0.0.1:27017/test
                - --eval
                - "quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
        labels:
          app.kubernetes.io/name: jurisflow
          app.kubernetes.io/component: mongodb
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
