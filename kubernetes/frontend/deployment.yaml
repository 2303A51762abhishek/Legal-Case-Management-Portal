apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: jurisflow
  labels:
    app.kubernetes.io/name: jurisflow
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: legal-case-management-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jurisflow
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: legal-case-management-portal
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: frontend
          image: legal-case-management-portal-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
