services:
  # -------------------------------------------------------------
  # 1. MongoDB Database Service
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: jurisflow-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-LegalCaseSecure2026}
      MONGO_INITDB_DATABASE: legal_case_management_db
    volumes:
      - mongodb_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - jurisflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "127.0.0.1:27017/test", "--eval", "quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------
  # 2. Express.js REST API Backend Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jurisflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-LegalCaseSecure2026}@mongodb:27017/legal_case_management_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-jurisflow_jwt_production_secret_key_2026_devops}
      JWT_EXPIRES_IN: 24h
      MAX_FILE_SIZE_BYTES: 10485760
      STUDENT_NAME: "MAMILLAPALLY ABHISHEK"
      STUDENT_ROLL: "2303A51762"
      ACADEMIC_YEAR: "2026-2027"
    volumes:
      - document_vault:/usr/src/app/src/uploads
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    networks:
      - jurisflow-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # -------------------------------------------------------------
  # 3. React.js + Nginx Production Frontend Service
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: jurisflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - jurisflow-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

# -------------------------------------------------------------
# Internal Isolated Network & Persistent Storage Volumes
# -------------------------------------------------------------
networks:
  jurisflow-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  document_vault:
    driver: local
